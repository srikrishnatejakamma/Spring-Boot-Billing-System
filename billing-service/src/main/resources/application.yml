spring:
  application:
    name: billing-service
  config:
    import: optional:classpath:platform-defaults.yml
  profiles:
    default: demo
    group:
      local: distributed
      production: distributed
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:file:./data/billing;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  flyway:
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  graphql:
    graphiql:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
server:
  address: 127.0.0.1
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:unused}
        application-key: ${DD_APP_KEY:unused}
        uri: ${DD_API_URI:https://api.datadoghq.com}
        step: 30s
  metrics:
    tags:
      service: ${spring.application.name}
      env: ${DD_ENV:local}
billing:
  distributed: false
  seed: true
  ledger:
    enabled: ${LEDGER_ENABLED:false}
  security:
    enabled: true
security:
  jwt:
    issuer: ${OIDC_ISSUER_URI:http://localhost:8180/realms/billing}
    jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/billing/protocol/openid-connect/certs}
    audience: ${OIDC_AUDIENCE:billing-api}
