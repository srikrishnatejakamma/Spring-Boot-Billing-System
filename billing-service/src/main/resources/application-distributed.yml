spring:
  config:
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:configtree:/run/secrets/
  cloud:
    config:
      enabled: true
      username: ${CONFIG_USER:config-local}
      password: ${CONFIG_PASSWORD:config-local-password}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/billing?serverTimezone=UTC}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing-local}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:billing}
    password: ${RABBIT_PASSWORD:billing-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        concurrency: 2
        prefetch: 10
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
billing:
  distributed: true
  seed: false
