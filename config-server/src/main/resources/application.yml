spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:classpath:/config-repository}
  security:
    user:
      name: ${CONFIG_USER:config-local}
      password: ${CONFIG_PASSWORD:config-local-password}
server:
  port: 8888
  address: ${SERVER_ADDRESS:127.0.0.1}
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health
