plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.dependency.management) apply false
    id 'base'
}

allprojects {
    group = 'com.acme.billing'
    version = '1.0.0'
    repositories { mavenCentral() }
}

configure(subprojects.findAll { it.name != 'frontend' }) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
        }
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test {
        useJUnitPlatform { excludeTags 'infrastructure' }
        finalizedBy jacocoTestReport
    }
    jacocoTestReport { reports { xml.required = true; html.required = true } }
}

tasks.register('verify') {
    group = 'verification'
    description = 'Test backend modules and test/build the React frontend.'
    dependsOn subprojects.collect { "${it.path}:test" }
    dependsOn ':frontend:build', ':billing-service:jacocoTestCoverageVerification', ':event-worker:jacocoTestCoverageVerification'
}
