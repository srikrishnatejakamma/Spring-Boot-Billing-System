worker:
  dynamodb:
    enabled: ${WORKER_DYNAMODB_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${WORKER_DYNAMODB_ENDPOINT:}
    table: ${WORKER_DYNAMODB_TABLE:billing-account-projection}
spring:
  rabbitmq:
    listener:
      simple:
        shutdown-timeout: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  config:
    import:
      - ${WORKER_CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}
      - optional:configtree:/run/secrets/
  cloud:
    config:
      enabled: true
      username: ${CONFIG_USER:config-local}
      password: ${CONFIG_PASSWORD:config-local-password}
