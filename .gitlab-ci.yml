stages: [test, package, canary, gate, promote]

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-user"

backend-test:
  stage: test
  image: gradle:8.14.3-jdk21
  script:
    - gradle :billing-core:test :billing-integrations:test :billing-api:test :billing-api:jacocoTestCoverageVerification --no-daemon
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/TEST-*.xml"
    paths: ["billing-api/build/reports/jacoco/"]

frontend-test:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test -- --run
    - npm run build
  artifacts:
    paths: ["frontend/dist/"]

infrastructure-test:
  stage: test
  image: gradle:8.14.3-jdk21
  services: ["docker:27-dind"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - gradle :billing-api:infrastructureTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: "billing-api/build/test-results/infrastructureTest/TEST-*.xml"

monitor-gate-test:
  stage: test
  image: python:3.13-alpine
  script: ["python -m unittest discover -s ci -p 'test_*.py'"]

package:
  stage: package
  image: gradle:8.14.3-jdk21
  needs: [backend-test, frontend-test, infrastructure-test, monitor-gate-test]
  script:
    - gradle :billing-api:bootJar -x :frontend:build --no-daemon
  artifacts:
    paths: ["billing-api/build/libs/billing-api-1.0.0.jar"]

# Deployment commands are supplied by the owning environment, not invented here.
# Configure both commands and canary-scoped Datadog monitors before enabling promotion.
canary:
  stage: canary
  image: alpine:3.22
  needs: [package]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $DD_MONITOR_IDS'
      when: manual
  allow_failure: false
  script:
    - test -n "$CANARY_DEPLOY_COMMAND"
    - sh -ec "$CANARY_DEPLOY_COMMAND"
  environment: { name: canary }

datadog-quality-gate:
  stage: gate
  image: python:3.13-alpine
  needs: [canary]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $DD_MONITOR_IDS'
  script: ["python ci/datadog_gate.py"]

promote:
  stage: promote
  image: alpine:3.22
  needs: [datadog-quality-gate, package]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $DD_MONITOR_IDS'
      when: manual
  allow_failure: false
  script:
    - test -n "$PROMOTE_COMMAND"
    - sh -ec "$PROMOTE_COMMAND"
  environment: { name: production }
