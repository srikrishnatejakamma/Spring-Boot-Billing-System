stages: [verify, infrastructure, package, canary, gate, promote]

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-user"

backend-verify:
  stage: verify
  image: gradle:8.14.3-jdk21
  script:
    - gradle :common-domain:test :common-dto:test :platform-support:test :billing-integrations:test :billing-service:test :event-worker:test :config-server:test :system-tests:test --no-daemon
    - gradle :billing-service:jacocoTestCoverageVerification :event-worker:jacocoTestCoverageVerification --no-daemon
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/TEST-*.xml"
    paths: ["billing-service/build/reports/jacoco/", "event-worker/build/reports/jacoco/"]

frontend-verify:
  stage: verify
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test -- --run
    - npm run build
  artifacts:
    paths: ["frontend/dist/"]

monitor-gate-verify:
  stage: verify
  image: python:3.13-alpine
  script:
    - python -m unittest discover -s ci -p 'test_*.py'

infrastructure-verify:
  stage: infrastructure
  image: gradle:8.14.3-jdk21
  services: ["docker:27-dind"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - gradle :system-tests:infrastructureTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: "system-tests/build/test-results/infrastructureTest/TEST-*.xml"

package:
  stage: package
  image: gradle:8.14.3-jdk21
  needs: [backend-verify, frontend-verify, monitor-gate-verify, infrastructure-verify]
  script:
    - gradle :billing-service:bootJar --no-daemon
  artifacts:
    paths: ["billing-service/build/libs/billing-service-1.0.0.jar"]

# The deployment platform supplies the real traffic-shift and rollback commands.
canary:
  stage: canary
  image: alpine:3.22
  needs: [package]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $ROLLBACK_COMMAND && $DD_MONITOR_IDS'
      when: manual
  allow_failure: false
  script:
    - test -n "$CANARY_DEPLOY_COMMAND"
    - sh -ec "$CANARY_DEPLOY_COMMAND"
  environment: { name: canary }

datadog-quality-gate:
  stage: gate
  image: python:3.13-alpine
  needs: [canary]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $ROLLBACK_COMMAND && $DD_MONITOR_IDS'
  script:
    - python ci/datadog_gate.py || { sh -ec "$ROLLBACK_COMMAND"; exit 1; }
  environment: { name: canary }

promote:
  stage: promote
  image: alpine:3.22
  needs: [datadog-quality-gate, package]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CANARY_DEPLOY_COMMAND && $PROMOTE_COMMAND && $ROLLBACK_COMMAND && $DD_MONITOR_IDS'
      when: manual
  allow_failure: false
  script:
    - test -n "$PROMOTE_COMMAND"
    - sh -ec "$PROMOTE_COMMAND"
  environment: { name: production }
